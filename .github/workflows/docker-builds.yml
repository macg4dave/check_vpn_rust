name: Docker multi-arch builds

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-publish:
    name: Build multi-arch images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch images
        env:
          REPO: ghcr.io/${{ github.repository }}
          PLATFORMS: linux/amd64,linux/arm64
        run: |
          set -euo pipefail
          TAG_BASE="$REPO"
          # Use short refs for tagging in PRs and commits
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-8)
          IMAGE_TAG="${TAG_BASE}:pr-${SHORT_SHA}"

          echo "Building multi-arch images for ${PLATFORMS}"
          docker buildx build --platform ${PLATFORMS} \
            --tag "${REPO}:latest" \
            --tag "${IMAGE_TAG}" \
            --push .

      - name: Save artifact - image digests
        if: always()
        run: |
          set -euo pipefail
          echo "Images pushed for ${{ github.sha }}"
          # list images as a marker file for the run
          mkdir -p artifacts
          echo "built: ${{ github.sha }}" > artifacts/manifest.txt

      - name: Upload built manifest
        uses: actions/upload-artifact@v4
        with:
          name: docker-manifest
          path: artifacts/manifest.txt

name: Release (Docker-based) - single tag v0.5b

on:
  push:
    tags:
      - 'v0.5b'

jobs:
  package-and-publish:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show runner info
        run: |
          uname -a
          docker --version || true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # NOTE: the project packaging takes place in the next step and uses
      # scripts/build-all-packages.sh. Building a multi-arch container image
      # from the repository root is not required for the release artifact
      # packaging and previously failed because a root Dockerfile does not
      # exist. Skipping direct image build here and relying on packaging
      # helpers to create the artifacts that will be uploaded to the release.

      - name: Build packages (Docker-based)
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "Packaging using Docker-based images for tag ${TAG_NAME}"
          chmod +x ./scripts/build-all-packages.sh
          ./scripts/build-all-packages.sh --platforms linux/amd64,linux/arm64 --version "${TAG_NAME}"

      - name: List built artifacts
        run: |
          echo 'Debian artifacts:'
          ls -la release/debian || true
          echo 'Fedora artifacts:'
          ls -la release/fedora || true

      - name: Create GitHub release + upload artifacts
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: v0.5b
          files: |
            release/debian/**/*
            release/fedora/**/*
            release/unix/**/*

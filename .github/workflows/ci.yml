name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *' # nightly run (UTC)
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Cache cargo bin (speed up cargo install)
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-bin-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bin-

      - name: Run tests
        run: cargo test --verbose

      - name: Run tests with all features
        run: cargo test --all-features --verbose

      - name: Install cargo-audit (secure check)
        run: |
          set -euo pipefail
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install --locked cargo-audit
          fi

      - name: Run security audit (cargo-audit) and capture log
        env:
          CARGO_TERM_COLOR: always
        run: |
          set -euo pipefail
          # capture human-readable output to audit.log
          cargo audit 2>&1 | tee audit.log || true

      - name: Upload cargo-audit log
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-log
          path: audit.log

      - name: Fail if vulnerabilities were found
        run: |
          set -e
          # run once more so the step exits non-zero if there are vulnerabilities
          cargo audit

  integration-serial:
    name: Repeatable integration tests (serial)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run selected integration tests sequentially (single-threaded)
        run: |
          set -euo pipefail
          export RUST_TEST_THREADS=1
          # Run tests that historically flaked when run in parallel/with global env
          cargo test --test ip_api_large_response_tests --verbose -- --test-threads=1
          cargo test --test networking_tests --verbose -- --test-threads=1
          cargo test --test config_lookup_tests --verbose -- --test-threads=1
          cargo test --test config_tests --verbose -- --test-threads=1

  lint:
    name: Lint (clippy + fmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build debug
        run: cargo build --verbose

      - name: Build release
        run: cargo build --release --verbose

name: Release (Docker-packaged)

on:
  push:
    tags:
      - 'v*'

jobs:
  package-and-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show runner info
        run: |
          uname -a
          docker --version || true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build packages (Docker-based)
        env:
          TAG_NAME: ${{ github.ref_name }}
          BUILD_CACHE: 1
        run: |
          set -euo pipefail
          echo "Packaging using Docker-based images for tag ${TAG_NAME}"
          chmod +x ./scripts/build-all-packages.sh
          ./scripts/build-all-packages.sh --platforms linux/amd64,linux/arm64 --version "${TAG_NAME}"

      - name: List built artifacts
        run: |
          echo 'Debian artifacts:'
          ls -la release/debian || true
          echo 'Fedora artifacts:'
          ls -la release/fedora || true

      - name: Install GitHub CLI
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl apt-transport-https gnupg
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Create GitHub release (if missing)
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # Create a release (idempotent; gh will error only if release exists)
          gh release create "${TAG_NAME}" --title "Release ${TAG_NAME}" --notes "Automated reproducible packages (built in Docker) for ${TAG_NAME}" || true

      - name: Upload release artifacts (gh)
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for f in release/debian/*.deb; do
            [ -f "$f" ] || continue
            echo "Uploading $f"
            gh release upload "${TAG_NAME}" "$f" --clobber || true
          done

          for f in release/fedora/*.rpm; do
            [ -f "$f" ] || continue
            echo "Uploading $f"
            gh release upload "${TAG_NAME}" "$f" --clobber || true
          done

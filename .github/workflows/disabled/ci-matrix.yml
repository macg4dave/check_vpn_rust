name: ARCHIVED — legacy CI Matrix

on:
  workflow_dispatch: {}

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - run: echo "This workflow is archived. Use docker-builds.yml and release-docker.yml instead."

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo bin (speed up cargo install)
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-bin-${{ hashFiles('**/Cargo.lock') }}

      - name: Install rustfmt & clippy
        run: |
          rustup component add rustfmt clippy || true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --verbose

      - name: Build release
        run: cargo build --release --verbose

      - name: Install cargo-audit (secure check)
        run: |
          set -euo pipefail
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install --locked cargo-audit
          fi

      - name: Run security audit (cargo-audit) and capture log (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          set -euo pipefail
          cargo audit 2>&1 | tee audit.log || true

      - name: Upload cargo-audit log (Unix)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-log-${{ matrix.os }}
          path: audit.log

      - name: Fail if vulnerabilities were found (Unix)
        if: matrix.os != 'windows-latest'
        run: cargo audit

      - name: Run security audit (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cargo audit 2>&1 | Tee-Object -FilePath audit.log; if ($LASTEXITCODE -ne 0) { Write-Output 'Vulnerabilities detected'; exit 1 }

      - name: Upload cargo-audit log (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-log-windows
          path: audit.log

      - name: Create tarball (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/release
          tar -czf check_vpn-${{ matrix.os }}.tar.gz check_vpn
          cd ../..

      - name: Create zip (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd target/release
          Compress-Archive -Path check_vpn.exe -DestinationPath check_vpn-${{ matrix.os }}.zip
          cd ../..

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: check_vpn-${{ matrix.os }}
          path: |
            target/release/*.tar.gz
            target/release/*.zip
            artifacts/**
          if-no-files-found: ignore

  docker-builds:
    name: Docker Builds (Debian & Fedora)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and test in Debian container
        run: |
          docker build -t check_vpn_debian -f contrib/Dockerfile.debian .
          docker run --rm check_vpn_debian cargo test

      - name: Build Debian release
        run: |
          docker run --rm -v ${{ github.workspace }}:/work -w /work check_vpn_debian bash -c "cargo build --release"
          cd target/release
          tar -czf check_vpn-debian.tar.gz check_vpn || true
          cd ../..

      - name: Build and test in Fedora container
        run: |
          docker build -t check_vpn_fedora -f contrib/Dockerfile.fedora .
          docker run --rm check_vpn_fedora cargo test

      - name: Build Fedora release
        run: |
          docker run --rm -v ${{ github.workspace }}:/work -w /work check_vpn_fedora bash -c "cargo build --release"
          cd target/release
          tar -czf check_vpn-fedora.tar.gz check_vpn || true
          cd ../..

      - name: Upload Docker build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: check_vpn-docker-builds
          path: target/release/*.tar.gz
          if-no-files-found: ignore

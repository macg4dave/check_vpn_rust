name: CI - Package (multi-arch)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request:

jobs:
  package:
    name: Build packages (multi-arch) and upload artifacts
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Cache cargo registry and git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run packaging via Makefile (uses scripts/build-all-packages.sh)
        env:
          VERSION: ${{ github.sha }}
          BUILD_CACHE: 1
        run: |
          set -euo pipefail
          # Build packages for default platforms (script defaults to linux/amd64,linux/arm64)
          make package-all VERSION=${VERSION}

      - name: List release artifacts
        run: |
          echo 'Artifacts in release/debian:' && ls -la release/debian || true
          echo 'Artifacts in release/fedora:' && ls -la release/fedora || true

      - name: Upload per-arch artifacts (debian)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debian-artifacts
          path: |
            release/debian/**/*

      - name: Upload per-arch artifacts (fedora)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fedora-artifacts
          path: |
            release/fedora/**/*

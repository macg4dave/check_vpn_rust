[package]
name = "check_vpn"
version = "1.1.0"
edition = "2021"
rust-version = "1.93.1"
description = "VPN monitoring and automatic reconnect"
license = "MIT"

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Production unwrap/expect restrictions live in src/lib.rs so test setup can
# continue to use explicit assertions and descriptive expect messages.

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
# Keep the existing OS-native TLS backend across the reqwest 0.13 upgrade.
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "native-tls", "charset", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
log = "0.4.35"
env_logger = "0.11.11"
ctrlc = { version = "3.5.2", features = ["termination"] }
anyhow = "1.0.104"
thiserror = "2.0.21"
shell-words = "1.1.1"

# XML configuration support is always available.
quick-xml = { version = "0.42.0", features = ["serialize"] }
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.23", optional = true, features = ["fmt", "env-filter"] }

[dev-dependencies]
httpmock = "0.9.0"
serial_test = "4.0.1"
tempfile = "3.27.0"

[features]
default = ["xml_pretty"]
# Compatibility flag: XML support no longer requires feature selection.
xml_quick = []
# Deny unknown fields when deserializing Config and other structs
xml_strict = []
# Pretty-print XML output when writing files (best-effort)
xml_pretty = []
# Extra observability via tracing spans (requires opting in)
xml_tracing = ["dep:tracing"]
# Enable structured/tracing-based logging and spans at compile time.
# This is an opt-in feature which bundles `tracing` and `tracing-subscriber`.
observability = ["dep:tracing", "dep:tracing-subscriber"]

[package.metadata.deb]
maintainer = "packager@example.com"
assets = [
	["INSTALL.md", "/usr/share/doc/check_vpn/INSTALL.md", "0644"],
	["target/release/check_vpn", "/usr/bin/check_vpn", "0755"],
	["contrib/config.xml", "/etc/check_vpn/config.xml", "0644"],
	["contrib/check_vpn.service", "/lib/systemd/system/check_vpn.service", "0644"],
	["contrib/systemd/check_vpn.service.d/limits.conf", "/lib/systemd/system/check_vpn.service.d/limits.conf", "0644"],
	["contrib/logrotate.conf", "/etc/logrotate.d/check_vpn", "0644"]
]

maintainer-scripts = "contrib/packaging"
